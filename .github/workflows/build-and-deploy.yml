name: Build, test, and publish weather artifacts

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB could not be started.' }
      - run: dotnet build Weather.slnx -c Release
      - run: dotnet test Weather.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: ui
          path: ui/dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-browser-results
          path: |
            ui/test-results
            ui/playwright-report

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: az bicep install
      - name: Compile and test the free-only infrastructure plan
        run: |
          az bicep build --file infra/main.bicep --outfile artifacts/infra/main.json
          node --test infra/*.test.mjs
      - name: Compile parameter bindings with nonsecret test values
        env:
          WEATHER_SQL_ADMIN_OBJECT_ID: '00000000-0000-0000-0000-000000000001'
          WEATHER_SQL_ADMIN_LOGIN: 'ci@example.invalid'
          WEATHER_AMBIENT_API_KEY: 'ci-placeholder'
          WEATHER_AMBIENT_APPLICATION_KEY: 'ci-placeholder'
          WEATHER_AMBIENT_MAC_ADDRESS: 'ci-station'
        run: az bicep build-params --file infra/main.bicepparam --outfile artifacts/infra/parameters.json

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose and build all container targets
        run: |
          docker compose --env-file .env.example --profile tools config --quiet
          docker compose --env-file .env.example --profile tools build
      - name: Smoke-test container entry points
        run: |
          docker run --rm weather-import:local --help
          docker run --rm weather-migrate:local --help
          docker compose --env-file .env.example up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5001/health; then break; fi
            sleep 2
          done
          test "$(curl --fail --silent http://localhost:5001/health)" = Healthy
          curl --fail --silent http://localhost:5000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | tee /tmp/mcp-response
          grep -q 'serverInfo' /tmp/mcp-response
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.example --profile tools down

  publish:
    needs: [tests, ui, infrastructure, containers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Publish API and triggered import WebJob
        shell: pwsh
        run: ./infra/Publish-WebApi.ps1
      - name: Verify the packaged WebJob
        run: |
          chmod +x artifacts/webapi/App_Data/jobs/triggered/weather-import/run.sh
          artifacts/webapi/App_Data/jobs/triggered/weather-import/run.sh --help
      - name: Publish services and migration artifacts
        run: |
          dotnet publish src/Weather.Mcp -c Release -o artifacts/mcp
          dotnet ef migrations has-pending-model-changes --project src/Weather.Infrastructure --configuration Release
          mkdir -p artifacts/database
          dotnet ef migrations script --idempotent --project src/Weather.Infrastructure --configuration Release -o artifacts/database/migrate.sql
          dotnet ef migrations bundle --project src/Weather.Infrastructure --configuration Release --self-contained --target-runtime linux-x64 -o artifacts/database/efbundle
          cp docs/deployment.md artifacts/database/README.md
          if find artifacts -iname 'appsettings.Local.json' | grep -q .; then
            echo 'Local settings must not be published.'; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: webapi
          path: artifacts/webapi
      - uses: actions/upload-artifact@v7
        with:
          name: mcp
          path: artifacts/mcp
      - uses: actions/upload-artifact@v7
        with:
          name: import-webjob
          path: artifacts/weather-import.zip
      - uses: actions/upload-artifact@v7
        with:
          name: database
          path: artifacts/database
