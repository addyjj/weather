name: Build, test, and deploy weather services

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB could not be started.' }
      - run: dotnet build Weather.slnx -c Release
      - run: dotnet test Weather.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: ui
          path: ui/dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-browser-results
          path: |
            ui/test-results
            ui/playwright-report

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose and build all container targets
        run: |
          docker compose --env-file .env.example --profile tools config --quiet
          docker compose --env-file .env.example --profile tools build
      - name: Smoke-test container entry points
        run: |
          docker run --rm weather-import:local --help
          docker run --rm weather-migrate:local --help
          docker compose --env-file .env.example up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5001/health; then break; fi
            sleep 2
          done
          test "$(curl --fail --silent http://localhost:5001/health)" = Healthy
          curl --fail --silent http://localhost:5000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | tee /tmp/mcp-response
          grep -q 'serverInfo' /tmp/mcp-response
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.example --profile tools down

  publish:
    needs: [tests, ui, containers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Publish services and migration artifacts
        run: |
          dotnet publish src/Weather.WebApi -c Release -o artifacts/webapi
          dotnet publish src/Weather.Mcp -c Release -o artifacts/mcp
          dotnet publish src/Weather.Import -c Release -o artifacts/import
          dotnet ef migrations has-pending-model-changes --project src/Weather.Infrastructure --configuration Release
          mkdir -p artifacts/database
          dotnet ef migrations script --idempotent --project src/Weather.Infrastructure --configuration Release -o artifacts/database/migrate.sql
          dotnet ef migrations bundle --project src/Weather.Infrastructure --configuration Release --self-contained --target-runtime linux-x64 -o artifacts/database/efbundle
          cp docs/deployment.md artifacts/database/README.md
          if find artifacts -iname 'appsettings.Local.json' | grep -q .; then
            echo 'Local settings must not be published.'; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: webapi
          path: artifacts/webapi
      - uses: actions/upload-artifact@v7
        with:
          name: mcp
          path: artifacts/mcp
      - uses: actions/upload-artifact@v7
        with:
          name: import
          path: artifacts/import
      - uses: actions/upload-artifact@v7
        with:
          name: database
          path: artifacts/database

  deploy-webapi:
    needs: publish
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: webapi
          path: package
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_DA30CB8E084F407C8E014A17CE6B638D }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_4D023636D5E24DEEA3F2E4692EBB5DCF }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5180F5D8922B4BCE98976EC3C8BB7297 }}
      - name: Configure existing Azure API host
        id: azure-host
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'weather-api' }}
          SLOT_NAME: ${{ vars.AZURE_WEBAPP_SLOT || 'Production' }}
          UI_ORIGIN: ${{ vars.WEATHER_UI_ORIGIN || 'https://weather-ui-rho.vercel.app' }}
        run: |
          resource_group=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
          test -n "$resource_group" && test "$resource_group" != None
          slot_args=()
          if [ "$SLOT_NAME" != Production ] && [ "$SLOT_NAME" != production ]; then
            slot_args=(--slot "$SLOT_NAME")
          fi
          kind=$(az webapp show -g "$resource_group" -n "$APP_NAME" "${slot_args[@]}" --query kind -o tsv)
          if [[ "$kind" == *linux* ]]; then
            az webapp config set -g "$resource_group" -n "$APP_NAME" "${slot_args[@]}" \
              --linux-fx-version 'DOTNETCORE|10.0' --startup-file 'dotnet Weather.WebApi.dll' \
              --web-sockets-enabled true -o none
          else
            az webapp config set -g "$resource_group" -n "$APP_NAME" "${slot_args[@]}" \
              --web-sockets-enabled true -o none
          fi
          az webapp update -g "$resource_group" -n "$APP_NAME" "${slot_args[@]}" --https-only true -o none
          hostname=$(az webapp show -g "$resource_group" -n "$APP_NAME" "${slot_args[@]}" --query defaultHostName -o tsv)
          hosts=$(az webapp show -g "$resource_group" -n "$APP_NAME" "${slot_args[@]}" --query "join(';', hostNames)" -o tsv)
          az webapp config appsettings set -g "$resource_group" -n "$APP_NAME" "${slot_args[@]}" \
            --settings "ASPNETCORE_URLS=http://0.0.0.0:8080" "Https__RedirectEnabled=false" \
            "AllowedHosts=$hosts" "Cors__AllowedOrigins__0=$UI_ORIGIN" -o none
          node scripts/configure-azure-settings.mjs "$resource_group" "$APP_NAME" "$SLOT_NAME"
          echo "url=https://$hostname" >> "$GITHUB_OUTPUT"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'weather-api' }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT || 'Production' }}
          package: package
      - name: Verify deployed API
        env:
          API_URL: ${{ steps.azure-host.outputs.url }}
          UI_ORIGIN: ${{ vars.WEATHER_UI_ORIGIN || 'https://weather-ui-rho.vercel.app' }}
          DATABASE_CONFIGURED: ${{ steps.azure-host.outputs.database_configured }}
        run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 10 "$API_URL/health"
          ready=false
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --max-time 30 -o /tmp/health.json -w '%{http_code}' "$API_URL/health/details")
            if [[ "$status" == 200 || "$status" == 503 ]] && \
              jq -e '.checks[] | select(.name == "ambient_weather_api") | .status == "Healthy"' /tmp/health.json; then
              if [ "$DATABASE_CONFIGURED" != true ] || \
                jq -e '.checks[] | select(.name == "database") | .status == "Healthy"' /tmp/health.json; then
                ready=true; break
              fi
            fi
            sleep 10
          done
          test "$ready" = true
          curl --fail --silent --retry 3 --retry-all-errors --retry-delay 3 "$API_URL/Devices" -o /tmp/devices.json
          jq -e 'type == "array" and length > 0' /tmp/devices.json
          curl --fail -s -D /tmp/cors-headers -o /dev/null -X OPTIONS "$API_URL/weatherHub/negotiate?negotiateVersion=1" \
            -H "Origin: $UI_ORIGIN" -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-signalr-user-agent'
          grep -iq "access-control-allow-origin: $UI_ORIGIN" /tmp/cors-headers

  deploy-mcp:
    needs: publish
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_MCP_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp
          path: package
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_DA30CB8E084F407C8E014A17CE6B638D }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_4D023636D5E24DEEA3F2E4692EBB5DCF }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5180F5D8922B4BCE98976EC3C8BB7297 }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_MCP_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_MCP_WEBAPP_SLOT || 'Production' }}
          package: package
